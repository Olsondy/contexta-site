<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 B · 编辑拼贴（关键帧）</title>
<style>
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Baskerville"; src: url("../../fonts/librebaskerville-LibreBaskerville.ttf") format("truetype"); font-weight: 400; }
@font-face { font-family: "Baskerville"; src: url("../assets/fonts/librebaskerville-LibreBaskerville-Italic.ttf") format("truetype"); font-style: italic; }
@font-face { font-family: "Tsanger YuYang"; src: url("../assets/fonts/tsanger-yuyang-400.subset.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "WenKai"; src: url("fonts/LXGWWenKai-500.woff") format("woff"); }
@font-face { font-family: "Caveat"; src: url("fonts/caveat-Caveat.ttf") format("truetype"); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
#film { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #dfe3de; }
/* 桌面的光：左上窗光，右下压暗 */
#film::before { content: ""; position: absolute; inset: 0; background: radial-gradient(1500px 1000px at 22% 8%, rgba(255,255,255,.55), transparent 60%), radial-gradient(140% 120% at 60% 60%, transparent 50%, rgba(37,40,37,.22)); }
.paper { position: absolute; background: #fbfcfa; box-shadow: 0 1px 1px rgba(37,40,37,.10), 0 10px 22px -6px rgba(37,40,37,.22), 0 34px 60px -24px rgba(37,40,37,.30); }
.paper::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.5), transparent 40%, rgba(37,40,37,.035)); pointer-events: none; }
/* 词卡 */
#card { left: 150px; top: 120px; width: 760px; height: 480px; transform: rotate(-3.2deg); background-image: repeating-linear-gradient(180deg, transparent 0 63px, #d5dad5 63px 65px); background-position: 0 92px; background-color: #fbfcfa; }
#card .rule { position: absolute; left: 0; right: 0; top: 112px; height: 2px; background: #c9b9c9; }
#card .w { position: absolute; left: 64px; top: 128px; font: 900 168px/1 "Satoshi"; letter-spacing: -.03em; color: #252825; }
#card .ph { position: absolute; left: 70px; top: 46px; font: 500 30px/1 "Satoshi"; color: #646a63; }
#card .sense { position: absolute; left: 70px; top: 352px; font: 400 52px/1 "Tsanger YuYang"; color: #252825; }
#card .sense b { font: 500 34px/1 "Satoshi"; color: #584e78; margin-right: 14px; }
.pencil { position: absolute; font: 500 40px/1.2 "WenKai"; color: #4a4f4a; opacity: .88; white-space: nowrap; }
svg.ink { position: absolute; overflow: visible; }
/* 句子纸条 */
.slip { width: 1320px; height: 132px; display: flex; align-items: center; padding: 0 46px; box-sizing: border-box; font: 400 40px/1 "Baskerville"; color: #2d302d; white-space: nowrap; }
.slip .no { position: absolute; left: 46px; top: 16px; font: 500 17px/1 "Satoshi"; letter-spacing: .16em; color: #8b918a; }
.slip .tw { position: relative; z-index: 1; }
.slip .hl { position: relative; display: inline-block; }
.slip .hl svg { position: absolute; left: -10px; right: -10px; top: 6px; width: calc(100% + 20px); height: 36px; z-index: -1; mix-blend-mode: multiply; }
#s1 { left: 760px; top: 560px; transform: rotate(2.2deg); }
#s2 { left: 700px; top: 716px; transform: rotate(-1.4deg); }
#s3 { left: 800px; top: 872px; transform: rotate(1deg); }
.gloss { position: absolute; font: 400 56px/1 "Caveat"; color: #584e78; white-space: nowrap; }
.gloss span { font: 500 36px/1 "WenKai"; margin-left: 16px; }
#stamp { position: absolute; left: 1660px; top: 840px; width: 230px; height: 230px; transform: rotate(-11deg); mix-blend-mode: multiply; opacity: .92; }
#claim { left: 1090px; top: 196px; font-size: 76px; color: #252825; transform: rotate(-2.5deg); opacity: .92; }
#grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .22; pointer-events: none; }
</style>
</head>
<body>
<div id="film" data-composition-id="b" data-width="1920" data-height="1080">
  <!-- 词卡：背过的意思 -->
  <div class="paper" id="card">
    <span class="ph">[praɪz]</span>
    <span class="w">prize</span>
    <span class="sense"><b>n.</b>奖项；奖品</span>
    <svg class="ink" style="left:60px; top:368px" width="330" height="30" viewBox="0 0 330 30"><path d="M4 18 C60 10 120 20 180 13 S280 9 326 15" fill="none" stroke="#3a3e3a" stroke-width="5" stroke-linecap="round"/><path d="M14 22 C90 15 170 22 250 16 S300 14 318 19" fill="none" stroke="#3a3e3a" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg>
    <span class="pencil" style="left:430px; top:356px; font-size:34px; transform: rotate(-4deg)">背过的意思</span>
  </div>

  <!-- 手写的结论 -->
  <span class="pencil" id="claim">意思，在句子里。</span>
  <svg class="ink" style="left:1080px; top:300px" width="420" height="40" viewBox="0 0 420 40"><path d="M6 26 C120 14 260 30 412 12" fill="none" stroke="#584e78" stroke-width="6" stroke-linecap="round" opacity=".75"/></svg>

  <!-- 三张句子纸条（小程序题目原句，非刊物剪报） -->
  <div class="paper slip" id="s1"><span class="no">语境 01</span><span class="tw">The committee decided to <span class="hl"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M3 9 C30 5 70 7 97 6 C99 18 99 28 96 36 C70 38 30 37 4 37 C1 27 1 17 3 9Z" fill="#9a90ba" opacity=".7"/></svg>prize</span> accuracy over speed …</span>
    <svg class="ink" style="left:690px; top:22px" width="370" height="96" viewBox="0 0 370 96"><path d="M30 14 C130 -4 330 2 360 40 C378 70 250 92 140 88 C40 84 -6 62 12 36 C22 22 60 12 100 10" fill="none" stroke="#584e78" stroke-width="3.5" stroke-linecap="round"/></svg>
  </div>
  <span class="gloss" style="left:500px; top:596px; transform: rotate(-3deg)">value<span>重视</span></span>

  <div class="paper slip" id="s2"><span class="no">语境 02</span><span class="tw">Local farmers continue to <span class="hl"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M2 8 C30 6 70 4 98 8 C99 18 100 28 97 35 C70 37 30 38 3 36 C1 26 0 16 2 8Z" fill="#9a90ba" opacity=".7"/></svg>prize</span> the traditional seed varieties …</span></div>
  <span class="gloss" style="left:380px; top:760px; transform: rotate(2deg)">treasure<span>珍视</span></span>

  <div class="paper slip" id="s3"><span class="no">语境 03</span><span class="tw">… researchers still consider them highly <span class="hl"><svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M3 10 C30 6 70 6 97 9 C99 19 99 29 96 35 C70 38 30 36 4 36 C1 27 1 18 3 10Z" fill="#9a90ba" opacity=".7"/></svg>prized</span> records …</span></div>
  <span class="gloss" style="left:500px; top:912px; transform: rotate(-2deg)">valued<span>珍贵的</span></span>

  <img id="stamp" src="../assets/completion-stamp.webp" alt="">

  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="3" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>
</div>
<script>window.__timelines = window.__timelines || {};</script>
</body>
</html>
