<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 C · 一镜到底（关键帧）</title>
<style>
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-latin-900-normal.woff2") format("woff2"); font-weight: 900; }
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Satoshi"; src: url("../assets/fonts/satoshi-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Tsanger YuYang"; src: url("../assets/fonts/tsanger-yuyang-400.subset.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Tsanger YuYang"; src: url("../assets/fonts/tsanger-yuyang-700.subset.woff2") format("woff2"); font-weight: 700; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
#film { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #9a90ba; font-family: "Satoshi", sans-serif; }
/* 色场：上一拍的深色桌面正被薰衣草色场推走（右上角残留），色场自身带一点光 */
#prev { position: absolute; inset: 0; background: #252825; clip-path: circle(520px at 2040px -120px); }
#film::after { content: ""; position: absolute; inset: 0; background: radial-gradient(1200px 760px at 46% 46%, rgba(255,255,255,.17), transparent 70%), radial-gradient(130% 130% at 50% 50%, transparent 55%, rgba(37,40,37,.22)); pointer-events: none; }
/* 上一个状态的残影：荧光笔下的 prize，沿路径飞过来 */
#ghost { position: absolute; left: 260px; top: 168px; font: 900 120px/1 "Satoshi"; letter-spacing: -.025em; color: #252825; opacity: .2; }
#ghost i { position: absolute; left: -14px; right: -14px; top: 64px; height: 46px; border-radius: 23px; background: #f3f4ef; opacity: .55; z-index: -1; }
#path { position: absolute; left: 0; top: 0; overflow: visible; }
/* 主角：同一个形状，此刻变成了答对的选项 */
#hero { position: absolute; left: 430px; top: 448px; width: 1060px; height: 164px; border-radius: 48px; background: #252825; box-shadow: 0 40px 80px -30px rgba(37,40,37,.55); overflow: hidden; }
#hero .fill { position: absolute; inset: 0; background: #7bc7a4; clip-path: circle(250px at 975px 82px); }
#hero .row { position: absolute; inset: 0; display: flex; align-items: center; gap: 34px; padding: 0 56px; }
#hero .m { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; background: #7bc7a4; color: #252825; font: 700 34px/1 "Satoshi"; flex: none; }
#hero .lb { font: 900 84px/1 "Satoshi"; color: #f3f4ef; letter-spacing: -.02em; }
#hero .zh { font: 400 38px/1 "Tsanger YuYang"; color: #c7cbc4; }
#hero .ck { position: absolute; right: 52px; top: 50%; width: 64px; height: 64px; margin-top: -32px; fill: none; stroke: #252825; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
#tap { position: absolute; left: 1350px; top: 528px; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 3px solid rgba(243,244,239,.75); opacity: .7; }
#prompt { position: absolute; left: 436px; top: 372px; font: 500 34px/1 "Satoshi"; color: #252825; opacity: .78; }
#prompt b { font-weight: 900; }
/* 状态链：这个形状在全片里依次变成什么，每个状态有自己的色场 */
#chain { position: absolute; left: 0; right: 0; top: 920px; display: flex; justify-content: center; align-items: center; gap: 22px; font: 400 26px/1 "Tsanger YuYang"; color: #252825; }
#chain .s { display: flex; align-items: center; gap: 10px; opacity: .55; }
#chain .s.on { opacity: 1; font-weight: 700; }
#chain .c { width: 18px; height: 18px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgba(37,40,37,.35); }
#chain .ar { opacity: .4; }
#tc { position: absolute; right: 80px; top: 70px; font: 500 24px/1 "Satoshi"; letter-spacing: .14em; color: #252825; opacity: .6; font-variant-numeric: tabular-nums; }
#grain { position: absolute; inset: 0; mix-blend-mode: overlay; opacity: .16; pointer-events: none; }
</style>
</head>
<body>
<div id="film" data-composition-id="c" data-width="1920" data-height="1080">
  <div id="prev"></div>
  <span id="ghost">prize<i></i></span>
  <svg id="path" width="1920" height="1080"><path d="M560 300 C620 400 760 420 900 452" fill="none" stroke="#252825" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round" opacity=".35"/></svg>
  <p id="prompt">The word “<b>prize</b>” is closest in meaning to:</p>
  <div id="hero">
    <div class="row"><span class="m">A</span><span class="lb">value</span><span class="zh">重视；珍视</span></div>
    <div class="fill"></div>
    <svg class="ck" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
  </div>
  <i id="tap"></i>
  <div id="chain">
    <span class="s"><i class="c" style="background:#f1f2f0"></i>划词</span><span class="ar">→</span>
    <span class="s"><i class="c" style="background:#252825"></i>句子</span><span class="ar">→</span>
    <span class="s on"><i class="c" style="background:#9a90ba"></i>选项</span><span class="ar">→</span>
    <span class="s"><i class="c" style="background:#7bc7a4"></i>答对</span><span class="ar">→</span>
    <span class="s"><i class="c" style="background:#fcf9e8"></i>印章</span><span class="ar">→</span>
    <span class="s"><i class="c" style="background:#9a90ba"></i>标志</span>
  </div>
  <span id="tc">00:15:12</span>
  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>
</div>
<script>window.__timelines = window.__timelines || {};</script>
</body>
</html>
